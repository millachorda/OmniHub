# Compila OmniHub y lo publica en GitHub Releases al crear una etiqueta vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versión desde la etiqueta
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar (un solo .exe autocontenido)
        shell: pwsh
        run: |
          dotnet publish OmniHub.csproj -c Release -o dist -p:Version=${{ steps.ver.outputs.version }}
          Copy-Item dist/OmniHub.exe dist/OmniHub-Setup.exe

      - name: Subir a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OmniHub.exe
            dist/OmniHub-Setup.exe
          generate_release_notes: true
